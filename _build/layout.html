<!-- Google Analytics — רק באתר האמיתי (לא בבדיקות מקומיות). בלי Google Signals ובלי התאמה אישית של פרסום.
     הנכס בחשבון ה-Google של העסק; שמירת נתונים: חודשיים. -->
<script>
  (function () {
    var host = location.hostname;
    if (host !== 'mor-cpa.co.il' && host !== 'www.mor-cpa.co.il') return;
    // הכניסות שלנו לא נספרות: פעם אחת בכל דפדפן נכנסים ל-?notrack (ול-?track כדי לבטל).
    // הסימון נשמר רק בדפדפן הזה, ולכן לא משפיע על אף גולש אחר.
    try {
      if (/[?&]notrack\b/.test(location.search)) localStorage.setItem('noga', '1');
      if (/[?&]track\b/.test(location.search)) localStorage.removeItem('noga');
      if (localStorage.getItem('noga')) return;
    } catch (e) {}
    var id = 'G-93BLXZ9RBC';
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', id, { allow_google_signals: false, allow_ad_personalization_signals: false });
  })();
</script>
</head>

          <path d="M11 33l8.5-9 6 5.5L37 16" fill="none" stroke="#2FE3A6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M30 16h7v7" fill="none" stroke="#F2C14E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
