<section class="page-hero bot-hero">
  <div class="wrap bot-wrap">
    <p class="eyebrow">{{bot_kicker}}</p>

      מעדיפים לדבר? <a href="{{wa_general}}" target="_blank" rel="noopener">כתבו לנו בוואטסאפ</a>.
