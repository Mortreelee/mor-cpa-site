
<!-- ========== מחשבון הצמדה למדד ==========
     החישוב ב-assets/madad-calc.js, הנתונים ב-assets/madad.json (הלמ"ס, סדרה 120010). -->
<section class="page-hero kc-hero">
  <div class="wrap page-hero-inner kc-head">
    <p class="eyebrow">מחשבון הצמדה למדד</p>
    <h1>כמה הסכום שווה <span class="grad">היום,</span><br><span class="grad">לפי המדד</span>?</h1>
  </div>
</section>

<section class="section kc-section">
  <div class="wrap gc-wrap">
    <div class="gc md" id="md">
      <div class="md-in">
        <div class="md-mode">
          <div class="sexrow" id="mdMode" role="group" aria-label="איך מחשבים">
            <button type="button" data-mode="m" aria-pressed="true">לפי חודש</button>
            <button type="button" data-mode="d" aria-pressed="false">לפי תאריך</button>
          </div>
          <small id="mdModeTxt"></small>
        </div>
        <label class="md-box md-sum">
          <span class="gc-lbl">סכום</span>
          <span class="md-amt"><input id="amt" inputmode="decimal" value="5,000" aria-label="סכום"><span>₪</span></span>
        </label>
        <div class="md-dates">
          <div class="md-box">
            <span class="gc-lbl">התחלה</span>
            <div class="md-date"><select id="aD" aria-label="יום"></select><select id="aM" aria-label="חודש"></select><select id="aY" aria-label="שנה"></select></div>
            <small class="md-idx" id="aIdx"></small>
          </div>
          <span class="md-arrow" aria-hidden="true">←</span>
          <div class="md-box">
            <span class="gc-lbl">סיום</span>
            <div class="md-date"><select id="bD" aria-label="יום"></select><select id="bM" aria-label="חודש"></select><select id="bY" aria-label="שנה"></select></div>
            <small class="md-idx" id="bIdx"></small>
          </div>
        </div>
      </div>

      <div class="gc-out" aria-live="polite">
        <p class="md-warn" id="mdWarn"></p>
        <div id="mdOut">
          <div class="gc-main">
            <strong id="res">—</strong>
          </div>
          <div class="gc-when">
            <div><small>השינוי במדד</small><b id="chg">—</b></div>
            <div><small>הפרש בסכום</small><b id="diff">—</b></div>
          </div>
          <p class="md-fac">מקדם הצמדה <span id="fac"></span> · המדד האחרון שפורסם: <span id="latest"></span></p>
        </div>
      </div>

      <div class="kc-cta">
        <p><b>שאלה על הצמדה בחוזה, בשכר דירה או במזונות?</b> נשמח לעזור.</p>
        <a class="btn btn-ghost" href="{{root}}#contact">שאלה? דברו איתנו</a>
      </div>
    </div>

    <p class="kc-assume">
      מדד המחירים לצרכן, כללי, של הלשכה המרכזית לסטטיסטיקה, כולל מקדמי השרשור בין בסיסי המדד. מ־1990.
    </p>
  </div>
</section>
